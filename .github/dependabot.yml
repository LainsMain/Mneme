version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      android-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/server"
    schedule:
      interval: weekly
    groups:
      server-dependencies:
        patterns:
          - "*"
