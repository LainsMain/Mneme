name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: server/go.sum

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

      - name: Decode Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mneme-release.jks"

      - name: Test and build signed Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mneme-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :android:app:testDebugUnitTest :android:app:assembleRelease \
            -PmnemeVersion="${{ steps.version.outputs.name }}" \
            -PmnemeVersionCode="${{ steps.version.outputs.code }}"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "Mneme-${{ steps.version.outputs.name }}.apk"

      - name: Test server
        working-directory: server
        run: go test ./...

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: egoisticfoil
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.name }}
          tags: |
            egoisticfoil/mneme-server:${{ steps.version.outputs.name }}
            egoisticfoil/mneme-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Mneme-${{ steps.version.outputs.name }}.apk" \
            LICENSE \
            --verify-tag --generate-notes --title "Mneme ${{ steps.version.outputs.name }}"
