name: mneme

# Production stack. Download this file and .env.example from the GitHub release,
# then run: cp .env.example .env && docker compose up -d
services:
  mneme-server:
    image: egoisticfoil/mneme-server:${MNEME_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      MNEME_DATA_DIR: /data
      MNEME_LISTEN: :8080
    volumes:
      - mneme-data:/data
    ports:
      - "127.0.0.1:${MNEME_LOCAL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/mneme", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      mneme-server:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    profiles: ["tunnel"]

volumes:
  mneme-data:
